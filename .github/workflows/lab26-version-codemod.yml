name: Lab26 refresh build identity checks

on:
  push:
    branches: [ lab26-network-permissions ]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lab26-version-codemod]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lab26-network-permissions
          fetch-depth: 0
      - name: Refresh only build-version assertions
        shell: pwsh
        run: |
          $changed = @()
          Get-ChildItem -Path scripts -Filter '*.js' -File -Recurse | ForEach-Object {
            $path = $_.FullName
            $text = [IO.File]::ReadAllText($path)
            if ($text -notmatch 'pkg\.version' -or $text -notmatch '2\.0\.0-lab\.25') { return }
            $next = $text.Replace('2.0.0-lab.25','2.0.0-lab.26')
            if ($next -ne $text) {
              [IO.File]::WriteAllText($path,$next,[Text.UTF8Encoding]::new($false))
              $changed += $_.FullName
            }
          }
          if ($changed.Count -eq 0) {
            Write-Host 'No stale build-version assertions remain.'
            exit 0
          }
          Write-Host 'Updated files:'
          $changed | ForEach-Object { Write-Host $_ }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "lab.26: refresh inherited build identity checks [lab26-version-codemod]"
          git push origin HEAD:lab26-network-permissions
