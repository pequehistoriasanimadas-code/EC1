name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Setup Python for embedded Kokoro runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare bundled local runtimes
        shell: powershell
        run: ./scripts/prepare-windows-runtime.ps1

      - name: Static and regression checks
        run: npm run check

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:portable

      - name: Windows packaged UI, Output, Kokoro, pronunciation and ONNX smoke tests
        shell: powershell
        timeout-minutes: 15
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          $exe = Join-Path $PWD 'dist\win-unpacked\EC Automatic News.exe'
          if (-not (Test-Path $exe)) { throw "No existe $exe" }
          if (-not (Test-Path (Join-Path $resources 'app.asar'))) { throw 'No existe app.asar empaquetado' }
          npx electron scripts/packaged-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged smoke test falló con código $LASTEXITCODE" }
          npx electron scripts/packaged-pronunciation-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged pronunciation smoke test falló con código $LASTEXITCODE" }
          npx electron scripts/packaged-onnx-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged ONNX smoke test falló con código $LASTEXITCODE" }

      - name: Upload portable folder
        uses: actions/upload-artifact@v7
        with:
          name: EC-Automatic-News-Portable-Folder
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: EC-Automatic-News-Windows-Portable-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
