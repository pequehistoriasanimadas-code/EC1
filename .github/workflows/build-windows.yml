name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Setup Python for embedded Kokoro runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare bundled local runtimes
        shell: powershell
        run: ./scripts/prepare-windows-runtime.ps1

      - name: Static and regression checks
        run: npm run check

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:portable

      - name: Windows UI and bridge self-test
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\EC Automatic News.exe'
          if (-not (Test-Path $exe)) { throw "No existe $exe" }

          $dataDir = Join-Path (Split-Path $exe -Parent) 'EC Automatic News Data'
          $log = Join-Path $dataDir 'logs\startup.log'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          $deadline = (Get-Date).AddMinutes(6)
          $ok = $false

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $log) {
              $tail = Get-Content $log -Raw -ErrorAction SilentlyContinue
              if ($tail -match 'SELF_TEST: OK') { $ok = $true; break }
            }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 2
            $p.Refresh()
          }

          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $log) {
            Write-Host '----- startup.log -----'
            Get-Content $log -Tail 200
            Write-Host '-----------------------'
          }

          if (-not $ok) {
            $exit = if ($p.HasExited) { $p.ExitCode } else { 'timeout' }
            throw "Self-test no confirmó SELF_TEST: OK (resultado: $exit)"
          }
          Write-Host 'SELF-TEST OK'

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: EC-Automatic-News-Portable-Folder
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: EC-Automatic-News-Windows-Portable-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
