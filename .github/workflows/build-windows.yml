name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Setup Python for embedded Kokoro runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Prepare bundled local runtimes
        shell: powershell
        run: ./scripts/prepare-windows-runtime.ps1

      - name: Static checks
        run: npm run check

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:portable

      - name: Windows self-test
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\EC Automatic News.exe'
          if (-not (Test-Path $exe)) { throw "No existe $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test falló con código $($p.ExitCode)" }
          Write-Host 'SELF-TEST OK'

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: EC-Automatic-News-Portable-Folder
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: EC-Automatic-News-Windows-Portable-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
