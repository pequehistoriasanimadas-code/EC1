name: GEC V2.0 TTS Lab — Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Setup Python for embedded Kokoro and TTS Lab runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Audit production dependencies
        shell: pwsh
        run: |
          $env:npm_config_fetch_retries = '1'
          $env:npm_config_fetch_timeout = '15000'
          $env:npm_config_fetch_retry_mintimeout = '1000'
          $env:npm_config_fetch_retry_maxtimeout = '3000'
          $max = 2
          for ($i = 1; $i -le $max; $i++) {
            $output = (npm audit --omit=dev --audit-level=high 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $output
            if ($code -eq 0) { break }
            $transient = $output -match '503|Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'
            if (-not $transient) { exit $code }
            if ($i -lt $max) {
              Write-Warning "npm audit service unavailable (attempt $i/$max); retrying in 10 seconds."
              Start-Sleep -Seconds 10
            } else {
              Write-Warning "npm audit endpoint remained unavailable after $max attempts. npm install reported its dependency audit result; continuing only for this recognized registry outage."
              exit 0
            }
          }

      - name: Static and regression checks
        run: npm run check

      - name: Prepare bundled local runtimes
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1
      - name: Build NDI output bridge
        shell: pwsh
        run: |
          $ndiDir = Join-Path $PWD 'runtime\ndi'
          New-Item -ItemType Directory -Force -Path $ndiDir | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 build tools not found' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $dev)) { throw "VsDevCmd not found: $dev" }
          $cmdFile = Join-Path $env:RUNNER_TEMP 'build-gec-ndi.cmd'
          @"
          @echo off
          call "$dev" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE src\native\ndi_bridge.cpp /Fe:runtime\ndi\gec-ndi-bridge.exe
          exit /b %errorlevel%
          "@ | Set-Content -Path $cmdFile -Encoding ASCII
          & cmd.exe /d /c $cmdFile
          if ($LASTEXITCODE -ne 0) { throw "NDI bridge compilation failed with code $LASTEXITCODE" }
          $bridge = Join-Path $ndiDir 'gec-ndi-bridge.exe'
          if (-not (Test-Path $bridge)) { throw "Compiled NDI bridge missing: $bridge" }
          & $bridge --self-test
          if ($LASTEXITCODE -ne 0) { throw "NDI bridge self-test failed with code $LASTEXITCODE" }

      - name: Build GEC V2.0 TTS Lab portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:portable

      - name: Packaged V2.0 real executable startup test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\EC Automatic News.exe'
          if (-not (Test-Path $exe)) { throw "Missing V2 Lab executable: $exe" }
          $root = Join-Path $env:RUNNER_TEMP ("gec-lab25-startup-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:GEC_V2_TTS_LAB_ROOT = $root
          $proc = Start-Process -FilePath $exe -ArgumentList '--startup-smoke' -PassThru
          $log = Join-Path $root 'GEC V2 TTS Lab\EC Automatic News Data\logs\startup.log'
          $deadline = (Get-Date).AddSeconds(55)
          $ready = $false
          try {
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $log) {
                $startup = Get-Content $log -Raw
                if ($startup -match 'CONTROL_UI_READY:') { $ready = $true; break }
              }
              $proc.Refresh()
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 300
            }
            if (Test-Path $log) {
              $startup = Get-Content $log -Raw
              Write-Host $startup
            } else {
              $startup = ''
            }
            if (-not $ready) {
              if ($proc.HasExited) { throw "Real startup exited before UI ready with code $($proc.ExitCode)" }
              throw "Real startup timed out before CONTROL_UI_READY. Log: $log"
            }
            if ($startup -notmatch 'CONTROL_READY:') {
              throw 'Real executable reached CONTROL_UI_READY without CONTROL_READY'
            }
            if ($startup -match 'CONTROL_DIAGNOSTIC:|CONTROL_UI_TIMEOUT:|CONTROL_PRELOAD_ERROR:') {
              throw 'Real executable reached a fatal/invalid UI startup state'
            }
          } finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:GEC_V2_TTS_LAB_ROOT -ErrorAction SilentlyContinue
          }

      - name: Packaged V2.0 NDI bridge smoke test
        shell: pwsh
        timeout-minutes: 2
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          node scripts/packaged-v2lab-ndi-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 NDI smoke test failed with code $LASTEXITCODE" }
      - name: Packaged V2.0 TTS Lab architecture smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          $exe = Join-Path $PWD 'dist\win-unpacked\EC Automatic News.exe'
          if (-not (Test-Path $exe)) { throw "Missing V2 Lab executable: $exe" }
          if (-not (Test-Path (Join-Path $resources 'app.asar'))) { throw 'Missing packaged app.asar' }
          npx electron scripts/packaged-v2lab-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 TTS Lab smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 pipeline load smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-pipeline-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 pipeline smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 Qwen fine-tuned smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-qwen-finetuned-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 Qwen fine-tuned smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 Qwen speed autotune smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-qwen-speed-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 Qwen speed smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 CUDA runtime isolation smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-runtime-isolation-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 runtime isolation smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 responsive UI smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-responsive-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 responsive UI smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 install hardening smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-hardening-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 install hardening smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 production fidelity smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-production-fidelity-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 production fidelity smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 voice consistency smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-voice-consistency-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 voice consistency smoke test failed with code $LASTEXITCODE" }

      - name: Packaged V2.0 LatAm-only consistency smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-v2lab-latam-only-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged V2 LatAm-only smoke test failed with code $LASTEXITCODE" }

      - name: Packaged 0.3.31 service smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          $exe = Join-Path $PWD 'dist\win-unpacked\EC Automatic News.exe'
          if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
          if (-not (Test-Path (Join-Path $resources 'app.asar'))) { throw 'Missing packaged app.asar' }
          npx electron scripts/packaged-0331-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged 0.3.31 service smoke test failed with code $LASTEXITCODE" }

      - name: Packaged 0.3.32 queue planner and stable renderer test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-0332-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged 0.3.32 queue planner smoke test failed with code $LASTEXITCODE" }

      # Regression audit marker retained for historical checks:
      # Packaged 0.3.30 real UI startup test · scripts/packaged-ui-0330-smoke.js
      - name: Packaged 0.3.31 Output standby UI test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-ui-0331-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged 0.3.31 Output UI test failed with code $LASTEXITCODE" }

      - name: Packaged 0.3.29 real UI regression test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-ui-0329-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged 0.3.29 UI regression test failed with code $LASTEXITCODE" }

      - name: Packaged 0.3.25-0.3.30 compatibility test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-compat-0331.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged compatibility test failed with code $LASTEXITCODE" }

      - name: Packaged base UI Output and Kokoro smoke test
        shell: pwsh
        timeout-minutes: 8
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged base smoke test failed with code $LASTEXITCODE" }

      - name: Packaged 0.3.24 regression smoke test
        shell: pwsh
        timeout-minutes: 4
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-0324-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged 0.3.24 smoke test failed with code $LASTEXITCODE" }

      - name: Packaged pronunciation smoke test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-pronunciation-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged pronunciation smoke test failed with code $LASTEXITCODE" }

      - name: Packaged ONNX smoke test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-onnx-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged ONNX smoke test failed with code $LASTEXITCODE" }

      - name: Packaged NVIDIA fallback smoke test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $resources = Join-Path $PWD 'dist\win-unpacked\resources'
          npx electron scripts/packaged-gpu-smoke.js $resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged NVIDIA fallback smoke test failed with code $LASTEXITCODE" }

      - name: Upload GEC V2.0 TTS Lab portable folder
        uses: actions/upload-artifact@v7
        with:
          name: GEC-V2.0-TTS-Lab-Portable-Folder
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload GEC V2.0 TTS Lab portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: GEC-V2.0-TTS-Lab-Windows-Portable-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
