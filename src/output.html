<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EC Automatic News — OUTPUT</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="output-0324.css">
</head>
<body>
<div id="viewport">
  <div id="dragRegion" aria-hidden="true"></div>
  <div id="stage" data-format="16:9" data-safe="none" data-kind="news">
    <div id="storyLayer" class="content-layer">
      <img id="image" alt="">
      <div id="shade"></div>
      <div id="lower">
        <div id="lowerContent">
          <div id="metaRow"><div id="cat">ACTUALIDAD</div><div id="pubDate"></div></div>
          <div id="title">Titular</div>
          <div id="summary"></div>
        </div>
      </div>
    </div>
    <div id="cannedLayer" class="content-layer hidden-layer">
      <div id="cannedBg"></div>
      <video id="cannedVideo" preload="auto" playsinline></video>
    </div>
  </div>
</div>
<audio id="audio"></audio>
<audio id="music" preload="auto"></audio>
<script src="output.js"></script>
<script src="output-0324.js"></script>
</body>
</html>
