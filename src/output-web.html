<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GEC Output LAN</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="output-0324.css">
  <link rel="stylesheet" href="output-0325.css">
  <link rel="stylesheet" href="output-0331.css">
  <link rel="stylesheet" href="output-web-mode.css">
</head>
<body>
<div id="viewport">
  <div id="stage" data-format="16:9" data-safe="none" data-kind="news">
    <div id="storyLayer" class="content-layer">
      <img id="image" alt="">
      <div id="shade"></div>
      <div id="lower"><div id="lowerContent"><div id="metaRow"><div id="cat">ACTUALIDAD</div><div id="pubDate"></div></div><div id="title">Titular</div><div id="summary"></div></div></div>
    </div>
    <div id="cannedLayer" class="content-layer hidden-layer"><div id="cannedBg"></div><video id="cannedVideo" preload="auto" playsinline></video></div>
  </div>
</div>
<audio id="audio"></audio>
<audio id="music" preload="auto"></audio>
<div id="monitorBar" class="monitor-bar hidden">
  <div class="monitor-status"><span id="monitorLiveDot"></span><b id="monitorMode">STANDBY</b><span id="monitorClock">00:00 / 00:00</span></div>
  <div class="monitor-audio"><button id="monitorMute" type="button">🔇 Audio monitor</button></div>
</div>
<script src="output-web-adapter.js"></script>
<script src="output.js"></script>
<script src="output-0324.js"></script>
<script src="output-0325.js"></script>
<script src="output-0326.js"></script>
<script src="output-0328.js"></script>
<script src="output-0331.js"></script>
<script src="output-web-mode.js"></script>
</body>
</html>
